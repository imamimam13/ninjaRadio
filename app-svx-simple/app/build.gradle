plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ninjaradio.svx'
    compileSdk 34

    defaultConfig {
        applicationId "com.ninjaradio.svx"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Pure-Java Opus codec (SvxReflector default codec = OPUS @ 16 kHz)
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
}
