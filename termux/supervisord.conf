[supervisord]
nodaemon=false
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# -------------------------------------------------------------
# 1. VoIP Mumble Server (Murmur Protocol - TCP/UDP 64738)
# -------------------------------------------------------------
[program:mumble-server]
command=murmurd -fg -ini /etc/mumble-server.ini
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/mumble_server.log
stderr_logfile=/app/data/logs/mumble_server.err.log
priority=10

# -------------------------------------------------------------
# 2. FreeDMR Master Engine (HBLink3 - UDP 62031 & 62030)
# -------------------------------------------------------------
[program:freedmr]
directory=/opt/freedmr
command=/opt/freedmr/entrypoint.sh
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/freedmr.log
stderr_logfile=/app/data/logs/freedmr.err.log
priority=20

# -------------------------------------------------------------
# 3. SvxReflector Multi-TG Conference Server (TCP/UDP 5300 & 8080)
# -------------------------------------------------------------
[program:svxreflector]
directory=/app/svxreflector
command=/app/svxreflector/entrypoint.sh
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/svxreflector.log
stderr_logfile=/app/data/logs/svxreflector.err.log
priority=20

# -------------------------------------------------------------
# 4. NinjaRadio Core Engine (Vocoders, USRP 32345, Control 5000)
# -------------------------------------------------------------
[program:core]
directory=/app/core
command=python3 -u core_engine.py
environment=USE_FREEDMR="true",USRP_AUDIO_PORT="32345",CONFIG_PATH="/app/data/config.json",PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/core.log
stderr_logfile=/app/data/logs/core.err.log
priority=30

# -------------------------------------------------------------
# 5. FastAPI Backend & Live WebSocket Hub (HTTP 8000)
# -------------------------------------------------------------
[program:backend]
directory=/app
command=uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
environment=PYTHONPATH="/app",DATABASE_URL="sqlite+aiosqlite:////app/data/ninjaradio.db"
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/backend.log
stderr_logfile=/app/data/logs/backend.err.log
priority=40

# -------------------------------------------------------------
# 6. Next.js 14 Responsive PWA Frontend (HTTP 3000)
# -------------------------------------------------------------
[program:frontend]
directory=/app/frontend
command=npm run start -- -p 3000 -H 0.0.0.0
environment=PORT="3000",NEXT_PUBLIC_API_URL="/api"
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/frontend.log
stderr_logfile=/app/data/logs/frontend.err.log
priority=50

# -------------------------------------------------------------
# 7. Mumble <-> DMR Audio Bridge Bot
# -------------------------------------------------------------
[program:mumble-bridge]
directory=/app/bridge-mumble
command=python3 -u bridge_mumble.py
environment=MUMBLE_HOST="127.0.0.1",MUMBLE_PORT="64738",DMR_USRP_HOST="127.0.0.1",DMR_USRP_PORT="32345",PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/mumble_bridge.log
stderr_logfile=/app/data/logs/mumble_bridge.err.log
priority=60

# -------------------------------------------------------------
# 8. SvxLink <-> DMR Audio Bridge
# -------------------------------------------------------------
[program:svxlink-bridge]
directory=/app/bridge-svxlink
command=python3 -u bridge_svxlink.py
environment=SVX_HOST="127.0.0.1",SVX_PORT="5300",DMR_USRP_HOST="127.0.0.1",DMR_USRP_PORT="32345",SVX_BRIDGE_RX_PORT="12348",SVX_BRIDGE_HTTP_PORT="12349",PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/svxlink_bridge.log
stderr_logfile=/app/data/logs/svxlink_bridge.err.log
priority=60

# -------------------------------------------------------------
# 9. Zello Channels API <-> DMR Audio Bridge
# -------------------------------------------------------------
[program:zello-bridge]
directory=/app/bridge-zello
command=python3 -u bridge_zello.py
environment=DMR_USRP_HOST="127.0.0.1",DMR_USRP_PORT="32345",ZELLO_BRIDGE_HTTP_PORT="12350",PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/zello_bridge.log
stderr_logfile=/app/data/logs/zello_bridge.err.log
priority=60
