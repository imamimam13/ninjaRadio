[GLOBAL]
TIMESTAMP_FORMAT="%c"
LISTEN_PORT=5300
HTTP_SRV_PORT=8080
# TG_FOR_V1_CLIENTS di-generate dinamis oleh entrypoint.sh dari config.json (defaultTg / default_talkgroup)
TG_FOR_V1_CLIENTS=1
ACCEPT_CALLSIGN=.*
SQL_TIMEOUT=300
SQL_TIMEOUT_BLOCKTIME=30
CODECS=OPUS,SPEEX,GSM

[SERVER_CERT]
# COMMON_NAME & SUBJECT_ALT_NAME di-generate otomatis oleh entrypoint.sh berdasarkan IP publik server aktif
COMMON_NAME=localhost
SUBJECT_ALT_NAME=DNS:localhost,DNS:svxreflector,IP:127.0.0.1

[USERS]
SVX-GATEWAY = NinjaReflectorNodes
* = NinjaReflectorNodes

[PASSWORDS]
NinjaReflectorNodes = "ninjaradio_svx"
