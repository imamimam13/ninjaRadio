name: Android

on:
  push:
    branches: [main]
    paths:
      - "app-android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ubuntu-latest already ships the Android SDK at $ANDROID_SDK_ROOT, so we
      # do not use android-actions/setup-android (it still runs `sdkmanager tools`,
      # a package removed from modern cmdline-tools, and fails the job).
      - name: Locate sdkmanager
        id: sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: ${SDK_ROOT}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n1 || true)"
          if [[ -z "${SDKMANAGER}" && -x "${SDK_ROOT}/tools/bin/sdkmanager" ]]; then
            SDKMANAGER="${SDK_ROOT}/tools/bin/sdkmanager"
          fi
          if [[ -z "${SDKMANAGER}" ]]; then
            echo "::error::sdkmanager not found under ${SDK_ROOT}"
            exit 1
          fi
          echo "path=${SDKMANAGER}" >> "$GITHUB_OUTPUT"
          echo "Using ${SDKMANAGER}"

      - name: Install SDK packages and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${{ steps.sdkmanager.outputs.path }}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --list_installed | grep -E "ndk|platforms;android|build-tools" || true

      - name: Build libopendmr.so for Android ABIs
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/26.1.10909125"
          echo "Using NDK at ${ANDROID_NDK_HOME}"
          chmod +x scripts/build_opendmr_android.sh
          ./scripts/build_opendmr_android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
