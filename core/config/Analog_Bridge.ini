; =======================================================
; NinjaRadio - DVSwitch Analog_Bridge Configuration File
; Supports: USRP (Android DVSwitch Mobile) <-> AMBE/PCM
; =======================================================

[GENERAL]
logLevel = 2
exportMetadata = true
subscriberFile = /var/lib/dvswitch/subscriber_ids.csv
decoderFallBack = true
useEmulator = false
emulatorAddress = 127.0.0.1:2470
outputAudioDevice = /dev/null
inputAudioDevice = /dev/null
useMicrophone = false
useVox = false

[AMBE_AUDIO]
address = 127.0.0.1
txPort = 31103
rxPort = 31100
ambeMode = DMR
minTxTimeMS = 2500
gatewayDmrId = 5109999
repeaterID = 510999901
txTg = 510
txTs = 1
colorCode = 1

[USRP]
address = 127.0.0.1
txPort = 32001
rxPort = 32000
usrpAudio = AUDIO_USE_BPF
tlvAudio = AUDIO_USE_BPF
usrpGain = 1.00
