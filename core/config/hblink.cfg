# =======================================================
# NinjaRadio - FreeDMR & HBLink3 Master Configuration File
# =======================================================

[GLOBAL]
PATH: ./
PING_TIME: 10
MAX_MISSED_PINGS: 3
DEBUG: True
LOG_FILE: /var/log/ninjaradio_hblink.log

[REPORTS]
REPORT: True
REPORT_PORT: 4321
REPORT_CLIENTS: 127.0.0.1

[LOGGER]
LOG_HANDLERS: console, file
LOG_LEVEL: INFO

# Master Server for MMDVM Hotspots (Pi-Star / OpenGD77 / WPSD)
[MASTER-1]
MODE: MASTER
ENABLED: True
REPEAT: True
MAX_PEERS: 128
EXPORT_AMBE: False
IP: 0.0.0.0
PORT: 62031
PASSPHRASE: ninjaradio_pass
DEFAULT_TG: 510
ALLOW_LOOP: False

# OpenBridge Connection to BrandMeister / FreeDMR Networks
[OPENBRIDGE-BM]
MODE: OPENBRIDGE
ENABLED: True
IP: 0.0.0.0
PORT: 62030
NETWORK_ID: 5109999
PASSPHRASE: openbridge_secret
TARGET_IP: 127.0.0.1
TARGET_PORT: 62030
TREE: 510,5101,5102,5103,5108,5109,5100
