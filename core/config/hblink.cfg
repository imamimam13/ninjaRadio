# =======================================================
# NinjaRadio - FreeDMR & HBLink3 Master Configuration File
# =======================================================

[GLOBAL]
PATH: ./
PING_TIME: 10
MAX_MISSED_PINGS: 3
DEBUG: True
LOG_FILE: /var/log/ninjaradio_hblink.log

[REPORTS]
REPORT: True
REPORT_PORT: 4321
REPORT_CLIENTS: 127.0.0.1

[LOGGER]
LOG_HANDLERS: console, file
LOG_LEVEL: INFO

# Master Server for MMDVM Hotspots (Pi-Star / OpenGD77 / WPSD)
[MASTER-1]
MODE: MASTER
ENABLED: True
REPEAT: True
MAX_PEERS: 128
EXPORT_AMBE: False
IP: 0.0.0.0
PORT: 62031
PASSPHRASE: ninjaradio_pass
DEFAULT_TG: 510
ALLOW_LOOP: False

# -------------------------------------------------------------
# MULTI-PEER OPENBRIDGE CONNECTIONS
# Anda dapat menambahkan sebanyak mungkin peer [OPENBRIDGE-xxx]
# untuk menghubungkan FreeDMR, BrandMeister, TGIF, dan Repeater Lokal!
# -------------------------------------------------------------

# Peer 1: FreeDMR Indonesia / Global Master
[OPENBRIDGE-FREEDMR]
MODE: OPENBRIDGE
ENABLED: True
IP: 0.0.0.0
PORT: 62030
NETWORK_ID: 5109999
PASSPHRASE: openbridge_secret
TARGET_IP: 127.0.0.1
TARGET_PORT: 62030
TREE: 510,5101,5102,5103,5108,5109,5100

# Peer 2: BrandMeister Indonesia Master (Contoh Peer Ke-2)
[OPENBRIDGE-BRANDMEISTER]
MODE: OPENBRIDGE
ENABLED: False
IP: 0.0.0.0
PORT: 62032
NETWORK_ID: 5109998
PASSPHRASE: bm_openbridge_secret
TARGET_IP: 103.10.10.1
TARGET_PORT: 62030
TREE: 510,91,92

# Peer 3: Jaringan Repeater Lokal / HBLink Lain (Contoh Peer Ke-3)
[OPENBRIDGE-LOCAL-JABAR]
MODE: OPENBRIDGE
ENABLED: False
IP: 0.0.0.0
PORT: 62033
NETWORK_ID: 5109997
PASSPHRASE: local_repeater_secret
TARGET_IP: 192.168.1.100
TARGET_PORT: 62030
TREE: 5109,5108

# -------------------------------------------------------------
# ECHO / PARROT AUDIO PLAYBACK SERVICE
# Layanan uji audio echo parrot (Default: TG / Private Call 9990)
# -------------------------------------------------------------
[PARROT]
MODE: PARROT
ENABLED: True
IP: 127.0.0.1
PORT: 62034
DEFAULT_TG: 9990
TIMEOUT: 15


